name: Publish Docker image

on:
  push:
    branches: [master]
    tags: ["v*"]
    paths:
      - ".dockerignore"
      - ".github/workflows/docker-publish.yml"
      - "Dockerfile"
      - "export.py"
      - "html_export.py"
      - "naming.py"
      - "requirements.txt"
  pull_request:
    branches: [master]
    paths:
      - ".dockerignore"
      - ".github/workflows/docker-publish.yml"
      - "Dockerfile"
      - "export.py"
      - "html_export.py"
      - "naming.py"
      - "requirements.txt"
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # Multi-platform images cannot be loaded locally, so pull requests
          # only build for amd64 before running the smoke test.
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          provenance: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          image="$(printf '%s\n' '${{ steps.meta.outputs.tags }}' | head -n1)"
          echo "Testing $image"
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            docker pull "$image"
          fi
          docker run --rm "$image" --help
